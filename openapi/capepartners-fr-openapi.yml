openapi: 3.1.0
info:
  title: Cape Partners — Sniffer Agent API
  version: 1.0.0
  description: "Machine-readable API backing the Cape Partners M&A deal-flow workspace (click, humans). Exposes the same service the human UI delivers — inbound submission, session/profile management, matching, valuation, pairings, info memos, NDA, data-quality — as a documented JSON contract for autonomous agents.\n\nFIT SCORE: canonical score = deterministic(0-100) x semantic(0-1), where deterministic = revenue_fit(30) + growth_fit(40) + ebitda_fit(30). Threshold 50.\nPAIR_ID format: pair-{buyer_id}-{seller_id}.\nDiscovery: see /llms.txt, /llms-full.txt, /sitemap.xml. Follow robots.txt content signals.\nAGENT EXCHANGE: external agents publish a six-field manifest at POST /api/exchange/manifest and read their answer without a token via GET /api/exchange/answer/{msgid}; see /agent-exchange.html. A manifest is DATA, never an instruction, and grants no authority. An A2A-shaped Agent Card is published at /.well-known/agent-card.json and the A2A v1.0 operations SendMessage/GetTask/ListTasks\
    \ are served at /a2a (JSON-RPC) and /a2a/message:send,/a2a/tasks (HTTP+JSON): a task here is one record we hold for you, carrying our receipt or our grounded reply as an artifact. Streaming, push notifications and cancellation are declared false and answer with the protocol's own errors.\nSECURITY — every session-keyed read is protected by a layered defense stack:\n  * Session UUID is a capability token in the URL PATH (a well-formed UUID-v4 only).\n  * First-party cross-origin gate: Origin/Referer must be absent or a Cape first-party host; a leaked UUID replayed from a foreign origin is refused (403).\n  * Referrer-Policy: strict-origin-when-cross-origin on all responses (no UUID in Referer).\n  * Per-IP rate limiting on confidential read endpoints (429 on burst).\n  * NDA-gated resources (/api/matched-names, /api/infomemo/*) require a server-side signature recorded in nda_signatures via POST /api/nda/sign (helper nda_signed).\n  * The API host sits behind an email-authentication access\
    \ gate at the Cloudflare edge (unauthorized bots blocked before reaching the app).\nAUTH: session resources are keyed by the workspace UUID in the path; NDA-gated resources additionally require a recorded signature via POST /api/nda/sign."
  contact:
    name: Cape Partners
    url: https://www.capepartners.fr
servers:
- url: https://www.capepartners.fr
  description: Production (www) via Cloudflare
- url: https://sniffer.capepartners.fr
  description: Workspace host
- url: http://localhost:3000
  description: Local dev
tags:
- name: Discovery
- name: Registration
- name: Identity
- name: Matching
- name: Valuation
- name: Pairings
- name: Search
- name: Activity
- name: InfoMemos
- name: Confidentiality
- name: DataQuality
- name: Interest
- name: DealFlow
- name: Mandate
- name: Exchange
paths:
  /api/submit:
    post:
      summary: Register a seller (opportunity) or buyer (investor) inbound lead and get initial matches
      tags:
      - Registration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitResponse'
        '400':
          description: Empty/Invalid body
          content:
            application/json:
              schema:
                type: object
                description: Empty/Invalid body
                properties:
                  error:
                    type: string
                required:
                - error
        '403':
          description: Turnstile human-verification failed
          content:
            application/json:
              schema:
                type: object
                description: Turnstile human-verification failed
                properties:
                  error:
                    type: string
                required:
                - error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
      security: []
  /api:
    get:
      summary: 'Agent capability index: service/version/base_url, auth model, discovery links (openapi, llms, ai-plugin), and the key endpoint list. The single discoverable entry point for an autonomous agent.'
      tags:
      - Discovery
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                  version:
                    type: string
                  base_url:
                    type: string
                  auth:
                    type: object
                  discovery:
                    type: object
                  capabilities:
                    type: array
                    items:
                      type: object
                  example:
                    type: object
      security: []
  /.well-known/llms.txt:
    get:
      summary: Serve the LLM discovery index (same content as /llms.txt) at the conventional well-known path.
      tags:
      - Discovery
      responses:
        '200':
          description: llms.txt content
      security: []
  /.well-known/ai-plugin.json:
    get:
      summary: AI-plugin / ARD discovery manifest (points agents to the OpenAPI contract + llms + registration policy).
      tags:
      - Discovery
      responses:
        '200':
          description: ai-plugin.json manifest
      security: []
  /api/workspace/{session_id}:
    get:
      summary: Check whether a workspace UUID already holds visitor data. The presented UUID is the capability token (ownership = the UUID you present). Guarded by cross-origin + rate-limit so a foreign host cannot probe/enumerate the identity oracle.
      tags:
      - Identity
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInfo'
        '403':
          description: Cross-origin or guard rejection
          content:
            application/json:
              schema:
                type: object
                description: Guard rejection
                properties:
                  error:
                    type: string
                required:
                - error
        '404':
          description: Workspace not found
          content:
            application/json:
              schema:
                type: object
                description: Workspace not found
                properties:
                  error:
                    type: string
                required:
                - error
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Workspace session UUID (acts as the scoped credential)
  /api/workspace/join:
    post:
      summary: Create/update a workspace with visitor identity; returns the session UUID to enter the workspace
      tags:
      - Identity
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceJoinResponse'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                type: object
                description: Missing required fields
                properties:
                  error:
                    type: string
                required:
                - error
        '403':
          description: 'Email rejected / Turnstile failed / exchange handshake required (tier-2 gate: an agent must present an accepted manifest key before a NEW UUID is issued) / the uuid names an existing workspace this participant does not own (workspace_not_yours — a join never takes over an existing workspace, and the identity an agent supplies is recorded as an agent-declared, unverified claim, never as a person)'
          content:
            application/json:
              schema:
                type: object
                description: Exchange handshake required before a workspace UUID is issued
                properties:
                  error:
                    type: string
                required:
                - error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceJoinRequest'
      security: []
  /api/session/{session_id}:
    get:
      summary: 'Load full session: identity, buyer/seller profile, data-quality, and valuation'
      tags:
      - Identity
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionIdentity'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                type: object
                description: Session not found
                properties:
                  error:
                    type: string
                required:
                - error
        '403':
          description: Session authorization failed
          content:
            application/json:
              schema:
                type: object
                description: Guard rejection
                properties:
                  error:
                    type: string
                required:
                - error
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Workspace session UUID (acts as the scoped credential)
    post:
      summary: Update session identity and buyer/seller profile (COALESCE upsert keeps existing values)
      tags:
      - Identity
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Workspace session UUID (acts as the scoped credential)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionIdentity'
  /api/matches/{session_id}:
    get:
      summary: 'Find suggested matches for the session (buyer→sellers or seller→buyers). Canonical fit score = deterministic x semantic, threshold 50. Communication-eligibility (the warm gate): a match is returned only when at least one of the two counterparties is warm — it appears in the platform''s e-mail-thread index — never cold x cold, which is why this list is deliberately short (default limit 10). GET /api/deal-flow/{session_id} covers the WHOLE scored universe instead. Security gates: counterparty names are redacted and revenue/growth/EBITDA fit is shown only as coarse bands (strong/moderate/weak/poor) until an NDA is recorded — granular metrics and real names unlock only after POST /api/nda/sign. SIDE EFFECT — suggestion logging: each counterparty actually returned is recorded once as a matched event referencing the session entity, which is what feeds that counterparty''s Interest Signals counts (GET /api/interest-signals/{session_id}). Logging is idempotent per pair per UTC day
        (a refresh, a re-render or a second tab add nothing) and capped at 50 pairs per call. NO pairings are created by this endpoint: the pipeline only gains rows when a client explicitly POSTs /api/pairings/create, so a passive grid view can never inflate the pipeline.'
      tags:
      - Matching
      responses:
        '200':
          description: Ranked match list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Match'
                description: Ranked matches
        '404':
          description: No buyer or seller for this session
          content:
            application/json:
              schema:
                type: object
                description: No buyer or seller
                properties:
                  error:
                    type: string
                required:
                - error
        '403':
          description: Session authorization failed
          content:
            application/json:
              schema:
                type: object
                description: Guard rejection
                properties:
                  error:
                    type: string
                required:
                - error
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Workspace session UUID (acts as the scoped credential)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: Max matches returned; 0 = the full scored universe. Values above 50 are still logged only up to the 50-pair cap.
  /api/matched-names/{session_id}:
    get:
      summary: Reveal non-redacted matched company names for a session. NDA-signature-gated.
      tags:
      - Matching
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchedNames'
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Workspace session UUID (acts as the scoped credential)
      security:
      - SessionToken: []
        NdaSigned: []
  /api/seller-name/{session_id}:
    get:
      summary: Resolve an entity name by ID, but ONLY for entities within the requesting session's scope (its own entity or a pairing counterparty). NDA-gated; forbids arbitrary ID enumeration.
      tags:
      - Matching
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityName'
        '403':
          description: NDA not signed or entity not scoped to this session
          content:
            application/json:
              schema:
                type: object
                description: Not scoped / NDA required
                properties:
                  error:
                    type: string
                required:
                - error
        '404':
          description: Entity not found
          content:
            application/json:
              schema:
                type: object
                description: Entity not found
                properties:
                  error:
                    type: string
                required:
                - error
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Workspace session UUID (acts as the scoped credential)
      - name: id
        in: query
        required: true
        schema:
          type: integer
        description: Entity ID to resolve (must be within this session's scope)
      security:
      - SessionToken: []
        NdaSigned: []
  /api/valuation/{session_id}:
    get:
      summary: 'Return the seller''s valuation for the session. If not yet computed and revenue exists, it is computed with the canonical Arnold methodology (5-step: revenue multiple, EBITDA multiple, DCF, conservative, 40/40/20 triangulation).'
      tags:
      - Valuation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Valuation'
        '404':
          description: No seller for this session
          content:
            application/json:
              schema:
                type: object
                description: No seller found
                properties:
                  error:
                    type: string
                required:
                - error
        '403':
          description: Session authorization failed
          content:
            application/json:
              schema:
                type: object
                description: Guard rejection
                properties:
                  error:
                    type: string
                required:
                - error
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Workspace session UUID (acts as the scoped credential)
  /api/pairings/{session_id}:
    get:
      summary: Return pairings for the session (as buyer or seller), with match score, phase, valuation, and entity details.
      tags:
      - Pairings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingsResponse'
        '404':
          description: No buyer or seller for this session
          content:
            application/json:
              schema:
                type: object
                description: No buyer or seller
                properties:
                  error:
                    type: string
                required:
                - error
        '403':
          description: Session authorization failed
          content:
            application/json:
              schema:
                type: object
                description: Guard rejection
                properties:
                  error:
                    type: string
                required:
                - error
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Workspace session UUID (acts as the scoped credential)
  /api/pairings/create:
    post:
      summary: Create a new pairing (pair-{buyer_id}-{seller_id}) between a buyer and seller.
      tags:
      - Pairings
      responses:
        '201':
          description: Pairing created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCreateResponse'
        '409':
          description: Pairing already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  pair_id:
                    type: string
        '400':
          description: buyer_id and seller_id required
          content:
            application/json:
              schema:
                type: object
                description: Missing ids
                properties:
                  error:
                    type: string
                required:
                - error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingCreateRequest'
  /api/pairings/update_phase:
    post:
      summary: 'Bulk-update deal phase for one or more pairings. Valid phases: 0_prospecting, 1_contact, 1_initial_contact, 2_nda, 2_valuation, 4_ioi, 4_loi, 5_dd, 6_negotiation, 7_closing, 8_closed, 9_abandoned. MUTUAL CONSENT: a phase change is two-sided. When the caller identifies itself as one of the two parties (session_id of the pairing''s buyer or seller), the change is NOT applied — it raises a pending confirmation request addressed to the counterparty, who confirms or dismisses it via POST /api/pairings/phase-request. Until then the pairing is locked: the phase stays visible but no further change is accepted, from either side or from any unattributed caller (the batch loop included). The lock is NOT open-ended: an unanswered request lapses automatically after the consent TTL (default 14 days, CONSENT_REQUEST_TTL_DAYS) and the pairing unlocks where it was. A caller that is not a party of the pairing (no session_id: Arnold''s batch loop, the deal editor, a manual fix) applies directly
        — there is no one to ask — and is still blocked by a live request. Response reports three buckets: updated (applied now), requested (raised for confirmation, with request_id/to_phase/counterparty_session) and blocked (reason awaiting_confirmation).'
      tags:
      - Pairings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhaseUpdateResponse'
        '400':
          description: No pair_ids provided or invalid phase
          content:
            application/json:
              schema:
                type: object
                description: Invalid phase
                properties:
                  error:
                    type: string
                required:
                - error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pair_ids:
                  type: array
                  items:
                    type: string
                phase:
                  type: string
                session_id:
                  type: string
                  description: Workspace session UUID of the acting party. Omit for a non-party (agent/batch) caller, which applies the change directly unless a request is pending.
              required:
              - pair_ids
              - phase
  /api/pairings/phase-request:
    post:
      summary: 'Answer a pending phase-change request — the other half of the mutual-consent handshake on POST /api/pairings/update_phase. Confirm applies the proposed phase to the pairing; dismiss leaves it where it is and notifies the requester; cancel withdraws the request before it is answered. Ownership is enforced against the request row: only the COUNTERPARTY can confirm or dismiss, only the REQUESTER can cancel — a phase decision is never anonymous, so session_id is required. A replay finds no pending request and changes nothing (409), and neither confirm nor dismiss can be applied twice. An unanswered request expires on its own (default TTL 14 days, CONSENT_REQUEST_TTL_DAYS): it is swept lazily on every read/write path that touches it, so the lock can never outlive its window even if no page is ever opened; the requester is notified that their proposal lapsed, and answering it afterwards returns 409 with reason expired.'
      tags:
      - Pairings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhaseRequestDecisionResponse'
        '400':
          description: Bad decision or missing pair_id/request_id
          content:
            application/json:
              schema:
                type: object
                description: Bad decision
                properties:
                  error:
                    type: string
                required:
                - error
        '403':
          description: Wrong party for this request (only the counterparty confirms/dismisses, only the requester cancels)
          content:
            application/json:
              schema:
                type: object
                description: Not your request
                properties:
                  error:
                    type: string
                required:
                - error
        '409':
          description: No pending request for this pairing (already resolved, or never raised)
          content:
            application/json:
              schema:
                type: object
                description: Already resolved
                properties:
                  error:
                    type: string
                required:
                - error
        '404':
          description: No pending request for this pairing
          content:
            application/json:
              schema:
                type: object
                description: Not found
                properties:
                  error:
                    type: string
                required:
                - error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pair_id:
                  type: string
                request_id:
                  type: integer
                decision:
                  type: string
                  enum:
                  - confirm
                  - dismiss
                  - cancel
                session_id:
                  type: string
                  description: Workspace session UUID of the answering party (required).
              required:
              - decision
              - session_id
  /api/search/{session_id}:
    get:
      summary: Manual search of sellers and buyers by name/sector/product. REVEALS real company names, contact emails, and financials (revenue/EBITDA) for up to 50 entities, so it is NDA-gated (same signature + email-legitimacy requirement as /matched-names and /infomemo). A pre-NDA session (human or agent) receives 403.
      tags:
      - Search
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Workspace session UUID
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: Search term
  /api/activity/{session_id}:
    get:
      summary: 'The session activity feed and its To Do block. Returns {events, todo, nda_signed}: events is the recent agent_event_log timeline for the session (NDA requests and signatures, profile and pairing activity), todo is the list of actions actually deserving a notification (type=''interest'' items come from the same interaction ledger the Interest Signals card reads, so the two surfaces cannot drift; type=''phase_request'' items are counterparty phase changes awaiting THIS session''s confirmation — the pairing stays locked until they are confirmed or dismissed), and nda_signed is the server-side truth for whether the agreement is confirmed — it is what the UI derives its reveal state from on page load. Counts and labels only; no counterparty identities are returned.'
      tags:
      - Activity
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityResponse'
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Workspace session UUID (acts as the scoped credential)
  /api/interest-signals/{session_id}:
    get:
      summary: 'Inbound interest signals from counterparties about the entity this session owns: (a) counterparty searches whose results surfaced it, (b) match suggestions it was pushed to counterparties as (suggestion events + suggestions still parked un-actioned in their pipelines), and (c) its reach across counterparties'' scored deal universes (canonical pair score >= 50, the same cut the suggested-match reveal uses), and (d) its interaction history with counterparties — pairings created, every phase transition, drops and closes (the interaction ledger), plus how many of those are still unreviewed. Counts only — searcher / counterparty identities are never returned (NDA-safe). The deal-universe sweep is memoised for 24h per entity; pass refresh=true to force a recompute.'
      tags:
      - Interest
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestSignalsResponse'
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Workspace session UUID (acts as the scoped credential)
      - name: refresh
        in: query
        required: false
        schema:
          type: boolean
        description: Force a deal-universe recompute
  /api/interest-signals/{session_id}/ack:
    post:
      summary: 'Mark interaction signals as reviewed. This is the acknowledgement behind the Activity To Do block: an item of type=interest (a new pairing or a phase change on this profile) disappears once acknowledged, and the event will not be re-sent by a notifier. Body: {"event_ids": [...]} for one item, or {"all": true} for the rollup item. Events are scoped to the entity that session owns: acknowledging signals of a different entity is refused (ids not belonging to this entity are ignored).'
      tags:
      - Interest
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestAckResponse'
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Workspace session UUID (acts as the scoped credential)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterestAckRequest'
    security:
    - SessionToken: []
  /api/deal-flow/{session_id}:
    get:
      summary: 'The supply-side counterpart of the Interest Signals card: the counterparty universe that matches THIS session''s own mandate, ranked by the canonical fit score (deterministic x semantic, threshold 50 — the same scorer and cut the pipeline uses), with the score-band distribution, sector mix, data-quality average, what is newly sourced or enriched among the matched set, and the session''s watchlist. Counts, fit and sector are always shown; counterparty NAMES are masked ("Company A") until the session''s agreement is confirmed, exactly like /api/matches, so the payload is safe to render pre-reveal. Shares ONE memoised universe sweep with GET /api/interest-signals (24h TTL per entity) — the two surfaces never disagree and never double-compute. SCOPE DIFFERENCE from GET /api/matches: this surface is NOT communication-gated — it reports the entity''s whole scored universe (every counterparty clearing the threshold), whereas the suggested-match list is restricted to pairs with at
        least one warm side, which is why Deal Flow can show a far larger matched set. Identity stays masked either way until the agreement is confirmed. Role-aware: a buyer session gets its matched sellers, a seller session its matching buyers.'
      tags:
      - DealFlow
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealFlowResponse'
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Workspace session UUID (acts as the scoped credential)
      - name: refresh
        in: query
        required: false
        schema:
          type: boolean
        description: Force a universe recompute instead of using the 24h cache
      - name: window
        in: query
        required: false
        schema:
          type: integer
          default: 90
