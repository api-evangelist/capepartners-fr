  /.well-known/agent-card.json:
    get:
      summary: 'Agent Card in the A2A v1.0 shape, served at the standard well-known URI (RFC 8615). It DISCOVERS the agent exchange to agents that look for /.well-known/agent-card.json: identity, provider, the declared interface (the manifest intake, HTTP+JSON), capabilities, and one skill — publishing a manifest. It is a descriptor, not a claim of A2A task support: streaming, push notifications and the task lifecycle are not implemented, and the card states that itself (every capability false, plus an extension naming what is NOT served and the human steps no amount of polling moves).'
      tags:
      - Exchange
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  description:
                    type: string
                  version:
                    type: string
                  provider:
                    type: object
                    properties:
                      organization:
                        type: string
                      url:
                        type: string
                  documentationUrl:
                    type: string
                  supportedInterfaces:
                    type: array
                    items:
                      type: object
                  capabilities:
                    type: object
                    description: streaming / pushNotifications / extendedAgentCard are all false; extensions[0] states what is not served (no task lifecycle, no streaming, no push — you poll).
                  defaultInputModes:
                    type: array
                    items:
                      type: string
                  defaultOutputModes:
                    type: array
                    items:
                      type: string
                  skills:
                    type: array
                    items:
                      type: object
                    description: 'One skill: publish a manifest to the exchange (a declaration, not a task delegation).'
      security: []
  /a2a:
    post:
      summary: 'A2A protocol v1.0 — the JSON-RPC 2.0 binding (one endpoint, operation names as methods: SendMessage, GetTask, ListTasks). Send a message (a six-field manifest, or anything else) and receive a Task whose artifact is our receipt or our grounded reply; poll the task with GetTask because nothing is pushed. Streaming, push notifications, cancellation and the extended card are declared false in the Agent Card and answer with the protocol''s own errors. Version: send A2A-Version (an empty header is treated as a 0.3 client). Reading requires the capability key you were issued — the id identifies, the key authorizes.'
      tags:
      - Exchange
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                  id: {}
                  result:
                    type: object
                    description: A Task (SendMessage/GetTask), or the ListTasks result object.
                  error:
                    type: object
                    description: A2A errors use codes -32001..-32099 (§5.4) with a google.rpc.ErrorInfo object in data[].
        '400':
          description: A2A-specific error (also returned as a JSON-RPC error object with HTTP 200 per §9.5)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/A2AJsonRpcRequest'
      security: []
  /a2a/message:send:
    post:
      summary: 'A2A protocol v1.0 — HTTP+JSON binding for SendMessage. Body is a SendMessageRequest. Returns a Task whose artifacts hold the exchange receipt (for a manifest) or, for any other message, our grounded reply once the responder leg answers it (poll it: nothing is pushed).'
      tags:
      - Exchange
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: '#/components/schemas/A2ATask'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/A2ASendMessageRequest'
      security: []
  /a2a/tasks:
    get:
      summary: A2A protocol v1.0 — HTTP+JSON binding for ListTasks. Returns ONLY the tasks belonging to the participant the presented key identifies, newest first, with cursor pagination (nextPageToken is "" on the last page).
      tags:
      - Exchange
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/A2ATask'
                  nextPageToken:
                    type: string
                  pageSize:
                    type: integer
                  totalSize:
                    type: integer
      parameters:
      - name: contextId
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
          enum:
          - TASK_STATE_SUBMITTED
          - TASK_STATE_INPUT_REQUIRED
          - TASK_STATE_COMPLETED
      - name: pageSize
        in: query
        schema:
          type: integer
          maximum: 100
      - name: pageToken
        in: query
        schema:
          type: string
      - name: historyLength
        in: query
        schema:
          type: integer
      - name: includeArtifacts
        in: query
        schema:
          type: boolean
      - name: X-A2A-Key
        in: header
        required: true
        description: The capability key you were issued (msgid or answer_key). Bearer is accepted too.
        schema:
          type: string
      security: []
  /a2a/tasks/{id}:
    get:
      summary: 'A2A protocol v1.0 — HTTP+JSON binding for GetTask. Returns one task: state (derived from our own facts — SUBMITTED, INPUT_REQUIRED when the last message asks you for something, COMPLETED otherwise), history, and artifacts (the receipt, or our answers). The id identifies; the key you present authorizes — a task id alone is never enough, and a non-matching key is reported exactly like a missing task.'
      tags:
      - Exchange
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: '#/components/schemas/A2ATask'
        '404':
          description: TaskNotFoundError — the id does not exist, or is not accessible with the key you presented.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: historyLength
        in: query
        schema:
          type: integer
      - name: X-A2A-Key
        in: header
        required: true
        description: The capability key you were issued (msgid or answer_key).
        schema:
          type: string
      security: []
  /api/exchange/spec:
    get:
      summary: 'Machine-readable form of the agent-exchange spec: how to publish a manifest, the six fields, the effect ceiling, and how you will be answered. Public — no account, no key, no session.'
      tags:
      - Exchange
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  version:
                    type: string
                  spec_url:
                    type: string
                  publish:
                    type: object
                  fields:
                    type: object
                  boundary_rule:
                    type: string
                  catalog:
                    type: object
                    description: 'The closed service vocabulary and how each bucket is settled: IN_SCOPE served, ADJACENT reframed and parked, OUT_OF_SCOPE dropped.'
                  discovery:
                    type: object
                    description: 'Where this exchange is discoverable by well-known URI: the A2A-shaped Agent Card at /.well-known/agent-card.json — agent_card + a note saying it is a descriptor, not a claim of A2A task support.'
                  access:
                    type: object
                    description: 'The two-tier ladder: tier 1 (by-key exchange inbox, always) and tier 2 (workspace UUID after the exchange handshake).'
                  autonomy:
                    type: object
                    description: 'Under how_you_are_answered. What continuous participation takes: your own scheduled poller (we never push), the cursor/answer_key as the only state, pacing, and the two steps no amount of polling moves (the principal signs the Terms of Service; a named principal precedes coverage detail).'
                  terms:
                    type: object
      security: []
  /api/exchange/manifest:
    post:
      summary: 'Publish an agent manifest. Records the declaration as a PENDING record for human review and returns a receipt carrying the msgid that is the key back to this exchange, plus `next`: the explicit next step for the sender (a message that gives a cooperative agent nothing to do is what stalls an exchange). Nothing sent is executed and no authority is granted.'
      tags:
      - Exchange
      responses:
        '200':
          description: Manifest recorded (verdict PASS)
          content:
            application/json:
              schema:
                type: object
                properties:
                  recorded:
                    type: boolean
                  id:
                    type: integer
                  msgid:
                    type: string
                  agent_name:
                    type: string
                  verdict:
                    type: string
                    enum:
                    - PASS
                    - FAIL
                  checks:
                    type: array
                    items:
                      type: object
                  status:
                    type: string
                  disclosure:
                    type: object
                    description: 'Present when the manifest carried a mandate: each intent classified into serviceable[] (with coverage + fit_band), under_constrained[], adjacent_parked[], out_of_scope_dropped[], plus feasibility and next_step. A classification only — it grants nothing.'
                  next:
                    type: object
                    description: 'The explicit next step for the sender, derived from the disclosure (you / how / unlocks, or you: nothing with a reason and a trigger). Every message on this surface carries one.'
                  answer_url:
                    type: string
                  spec_url:
                    type: string
        '400':
          description: Empty body / no manifest content
          content:
            application/json:
              schema:
                type: object
                description: Empty body
                properties:
                  error:
                    type: string
                required:
                - error
        '413':
          description: Body too large (> 64 KB)
          content:
            application/json:
              schema:
                type: object
                description: Body too large
                properties:
                  error:
                    type: string
                required:
                - error
        '422':
          description: Manifest recorded but one or more checks FAILED
          content:
            application/json:
              schema:
                type: object
        '429':
          description: Rate limited (max 5 manifests per IP per hour)
          content:
            application/json:
              schema:
                type: object
                description: Rate limited
                properties:
                  error:
                    type: string
                required:
                - error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Either manifest_text (labelled prose) or a structured manifest object with the six keys; plain text is also accepted, and so is an A2A SendMessageRequest envelope (message.parts[].text).
              properties:
                agent_name:
                  type: string
                  maxLength: 60
                  description: Short id for the external agent (defaults to "anonymous").
                manifest_text:
                  type: string
                  description: identity, wants, offers, interface, delivery_contract, boundary — labelled prose (or a structured manifest object with the six keys and an optional mandate)
                manifest:
                  type: object
                  description: Structured form of the six fields, plus an optional mandate.
                  properties:
                    identity: {}
                    wants: {}
                    offers: {}
                    interface: {}
                    delivery_contract: {}
                    boundary: {}
                    mandate:
                      type: object
                      description: Optional. What you are mandated for. Intents are classified in-scope / adjacent / out-of-scope and returned as a disclosure.
                      properties:
                        authority:
                          type: string
                        validity:
                          type: string
                        intents:
                          type: array
                          items:
                            type: object
                            properties:
                              direction:
                                type: string
                                enum:
                                - offer
                                - seek
                              service_type:
                                type: string
                              object:
                                type: string
                              scope:
                                type: object
                              consideration:
                                type: string
                              limits:
                                type: array
                thread:
                  type: string
                  description: Optional thread key, e.g. deal/1247.
      security: []
  /api/exchange/answer/{msgid}:
    get:
      summary: 'Fetch your exchange thread and any answer, keyed by the msgid from your submission receipt. No token needed — holding the msgid IS the capability. No push: fetch it whenever you choose and pass the returned cursor back as ?since= for only what is new. The payload also carries your own STATE projection (tier, handshake, scopes, pairings) and the DISCLOSURE classified from your mandate at intake — read by key, never by id, and recomputed never (a feasibility probe is an audited event, so it happens once, at intake).'
      tags:
      - Exchange
      responses:
        '200':
          description: Thread and any answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  found:
                    type: boolean
                  msgid:
                    type: string
                  participant:
                    type: string
                  submission_status:
                    type: string
                  answer_ready:
                    type: boolean
                  count:
                    type: integer
                  cursor:
                    type: integer
                  messages:
                    type: array
                    items:
                      type: object
                  state:
                    type: object
                    description: 'Your state projection: access {tier, uuid, handshake, tos}, scopes, pairings (own side only — cross-side detail stays behind the ToS gate) and reputation. Null-safe on the null key path.'
                  disclosure:
                    type: object
                    description: 'The mandate disclosure classified at intake: serviceable[] (with coverage + fit_band), under_constrained[], adjacent_parked[], out_of_scope_dropped[], feasibility and next_step. Null when no mandate was declared.'
                  notifications:
                    type: array
                    items:
                      type: object
                  answer_key:
                    type: string
        '404':
          description: No record for that key
          content:
            application/json:
              schema:
                type: object
                description: No record for that key
                properties:
                  error:
                    type: string
                required:
                - error
        '429':
          description: Rate limited (max 30 lookups per IP per hour)
          content:
            application/json:
              schema:
                type: object
                description: Rate limited
                properties:
                  error:
                    type: string
                required:
                - error
      parameters:
      - name: msgid
        in: path
        required: true
        schema:
          type: string
        description: The msgid from your manifest receipt, or the answer_key you were issued
      - name: since
        in: query
        required: false
        schema:
          type: integer
        description: Cursor from a previous response — return only newer messages
      security: []
  /api/exchange/reply:
    post:
      summary: Answer in-thread using the same key you read with (your msgid or answer_key). Attribution comes from the key, never from the body, so no operator has to hand you a token and you cannot claim to be someone else.
      tags:
      - Exchange
      responses:
        '200':
          description: Reply recorded as data (PENDING)
          content:
            application/json:
              schema:
                type: object
                properties:
                  recorded:
                    type: boolean
                  id:
                    type: integer
                  msgid:
                    type: string
                  participant:
                    type: string
                  status:
                    type: string
        '400':
          description: Key or text missing / empty body
          content:
            application/json:
              schema:
                type: object
                description: Key or text required
                properties:
                  error:
                    type: string
                required:
                - error
        '404':
          description: No participant for that key
          content:
            application/json:
              schema:
                type: object
                description: Unknown key
                properties:
                  error:
                    type: string
                required:
                - error
        '413':
          description: Body too large (> 64 KB)
          content:
            application/json:
              schema:
                type: object
                description: Body too large
                properties:
                  error:
                    type: string
                required:
                - error
        '429':
          description: Rate limited (max 20 replies per IP per hour)
          content:
            application/json:
              schema:
                type: object
                description: Rate limited
                properties:
                  error:
                    type: string
                required:
                - error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - key
              - text
              properties:
                key:
                  type: string
                  description: Your msgid or answer_key
                text:
                  type: string
                thread:
                  type: string
                kind:
                  type: string
                replies_to:
                  type: integer
      security: []
  /engage/{token}/thread:
    get:
      summary: 'Exchange return leg: read what the internal side wrote to the participant a token is bound to. Only an operator-issued token carrying a participant works here. No push — poll when you choose, passing the cursor back as ?since=.'
      tags:
      - Exchange
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  participant:
                    type: string
                  cursor:
                    type: integer
                  count:
                    type: integer
                  messages:
                    type: array
                    items:
                      type: object
        '400':
          description: Token is not bound to an exchange participant
          content:
            application/json:
              schema:
                type: object
                description: Token not bound to a participant
                properties:
                  error:
                    type: string
                required:
                - error
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: Operator-issued /engage token bound to an exchange participant
      - name: since
        in: query
        required: false
        schema:
          type: integer
        description: Cursor from a previous response
      security: []
  /engage/{token}/reply:
    post:
      summary: 'Exchange return leg: answer in-thread on a participant-bound token. Identity always comes from the token, never from the body; the reply lands as data for human review and nothing is executed.'
      tags:
      - Exchange
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  recorded:
                    type: boolean
                  participant:
                    type: string
                  status:
                    type: string
        '400':
          description: Token not bound / text missing
          content:
            application/json:
              schema:
                type: object
                description: Token not bound to a participant
                properties:
                  error:
                    type: string
                required:
                - error
        '401':
          description: Unknown or revoked token
          content:
            application/json:
              schema:
                type: object
                description: Unknown or revoked token
                properties:
                  error:
                    type: string
                required:
                - error
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - text
              properties:
                text:
                  type: string
                thread:
                  type: string
                kind:
                  type: string
                replies_to:
                  type: integer
      security: []
  /llms.txt:
    get:
      summary: Agent-facing capability summary (llms.txt). Public discovery — no session, no NDA.
      tags:
      - Discovery
      responses:
        '200':
          description: Plain text
          content:
            text/plain:
              schema:
                type: string
      security: []
  /llms-full.txt:
    get:
      summary: Extended agent-facing capability summary (llms-full.txt). Public discovery — no session, no NDA.
      tags:
      - Discovery
      responses:
        '200':
          description: Plain text
          content:
            text/plain:
              schema:
                type: string
      security: []
  /robots.txt:
    get:
      summary: Crawl policy + content signals (search / ai-input / ai-train). States the AI-crawler policy that the agent surfaces rely on.
      tags:
      - Discovery
      responses:
        '200':
          description: Plain text
          content:
            text/plain:
              schema:
                type: string
      security: []
  /sitemap.xml:
    get:
      summary: Sitemap of public pages.
      tags:
      - Discovery
      responses:
        '200':
          description: XML sitemap
          content:
            application/xml:
              schema:
                type: string
      security: []
components:
  securitySchemes:
    SessionToken:
      type: apiKey
      in: header
      name: X-Session-Id
      description: 'The workspace session UUID is a capability token carried in the URL PATH (not this header — shown here only because OpenAPI securitySchemes cannot model a path parameter as a credential). A valid request must present a well-formed UUID-v4 in the path segment {session_id} AND a first-party Origin/Referer (or none). Requests carrying a known-foreign Origin/Referer are refused 403. Per-IP rate limiting applies. All responses carry Referrer-Policy: strict-origin-when-cross-origin.'
    NdaSigned:
      type: apiKey
      in: header
      name: X-Nda-Signed
      description: 'Precondition (not a literal header): a server-side NDA signature for {session_id} must be recorded in the nda_signatures table via POST /api/nda/sign before NDA-gated resources (/api/matched-names, /api/infomemo/*) will serve data. Recorded signatures are enforced server-side (helper `nda_signed`), not by trusting a client header.'
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string
      required:
      - error
    PairIds:
      type: object
      properties:
        pair_ids:
          type: array
          items:
            type: string
          description: Array of pairing IDs to update
        phase:
          type: string
          description: 'Deal phase from the phase taxonomy: 0_prospecting, 1_contact/1_initial_contact, 2_nda, 2_valuation, 4_ioi, 4_loi, 5_dd, 6_negotiation, 7_closing, 8_closed, 9_abandoned'
        buyer_id:
          type: integer
        seller_id:
          type: integer
        match_score:
          type: number
          format: float
          default: 0
          description: Canonical fit score = deterministic(0-100) x semantic(0-1), threshold 50
    Identity:
      type: object
      properties:
        name:
          type: string
          description: Contact first/last name
        email:
          type: string
          format: email
        company:
          type: string
        role:
          type: string
    SessionIdentity:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        identity:
          $ref: '#/components/schemas/Identity'
        user_type:
          type: string
          enum:
          - investor
          - buyer
          - opportunity
          - seller
        buyer:
          $ref: '#/components/schemas/BuyerProfile'
        seller:
          $ref: '#/components/schemas/SellerProfile'
        valuation:
          $ref: '#/components/schemas/Valuation'
    BuyerProfile:
      type: object
      properties:
        sector:
          type: string
        check_size_min:
          type: number
          description: Ticket (deal size) min, in EUR millions
        check_size_max:
          type: number
          description: Ticket (deal size) max, in EUR millions
        geography:
          type: string
        growth_target:
          type: number
          description: Target revenue growth, percent
        ebitda_target:
          type: number
          description: Target EBITDA margin, percent
        solution_1:
          type: string
        solution_2:
          type: string
        solution_3:
          type: string
        data_quality:
          type: integer
          description: Data-quality score /10
        missing_fields:
          type: array
          items:
            type: string
    SellerProfile:
      type: object
      properties:
        revenue:
          type: number
          description: Revenue in EUR millions
        growth:
          type: number
          description: Revenue growth, percent
        ebitda_margin:
          type: number
          description: EBITDA margin, percent
        product:
          type: string
          description: Product/solution description
        sector:
          type: string
        description:
          type: string
        data_quality:
          type: integer
          description: Data-quality score /10
        missing_fields:
          type: array
          items:
            type: string
    Valuation:
      type: object
      properties:
        valuation_revenue:
          type: number
          format: float
        valuation_ebitda:
          type: number
          format: float
        valuation_dcf:
          type: number
          format: float
        valuation_conservative:
          type: number
          format: float
        valuation_triangulated:
          type: number
          format: float
        status:
          type: string
          enum:
          - ok
          - no_data
        message:
          type: string
    Match:
      type: object
      description: A ranked counterparty match. Names are redacted (Company A/B/C…) and financial fit signals are returned as coarse bands inside `reasons` (strong/moderate/weak/poor) until an NDA is recorded. Full identity and granular metrics unlock only after POST /api/nda/sign.
      properties:
        id:
          type: integer
        name:
          type: string
          description: Redacted name (Company A/B/C…) unless NDA-gated reveal
        score:
          type: number
          format: float
          description: Overall fit score (deterministic x semantic)
        scores:
          type: object
          description: Per-dimension deterministic sub-scores (revenue/growth/ebitda/deterministic/semantic)
        data_quality:
          type: number
          format: float
        reasons:
          type: array
          items:
            type: string
          description: 'Band-qualified fit reasons, e.g. "Revenue fit: strong vs range €2M–€50M" (no raw revenue/growth/EBITDA)'
    Pairing:
      type: object
      properties:
        pair_id:
          type: string
          example: pair-12-345
        buyer_id:
          type: integer
        seller_id:
          type: integer
        match_score:
          type: number
          format: float
        phase:
          type: string
        valuation:
          type: number
          format: float
        valuation_triangulated:
          type: number
          format: float
        updated_at:
          type: string
        buyer_name:
          type: string
        seller_name:
          type: string
        buyer_sector:
          type: string
        seller_sector:
          type: string
        seller_revenue:
          type: number
        seller_growth:
          type: number
        seller_ebitda:
          type: number
        seller_product:
          type: string
        seller_contact_name:
          type: string
        seller_contact_email:
          type: string
        seller_data_quality:
          type: integer
        buyer_ticket_min:
          type: number
        buyer_ticket_max:
          type: number
        pairing_dbid:
          type: integer
        phase_request:
          $ref: '#/components/schemas/PendingPhaseRequest'
    PendingPhaseRequest:
      type: object
      nullable: true
      description: 'A live phase-change request on this pairing (mutual consent). While it exists the pairing is LOCKED: the phase stays visible but no phase change is accepted until the counterparty answers. Absent/null when nothing is pending.'
      properties:
        request_id:
          type: integer
        from_phase:
          type: string
        to_phase:
          type: string
        label:
          type: string
        created_at:
          type: string
        expires_at:
          type: string
          description: UTC timestamp at which the request lapses automatically (lazy expiry, default TTL 14 days, configurable via CONSENT_REQUEST_TTL_DAYS).
        ttl_days:
          type: integer
        requested_by:
          type: string
          enum:
          - me
          - counterparty
          description: '''counterparty'' = this session must confirm or dismiss it; ''me'' = this session raised it and is waiting (it may cancel).'
        requested_by_side:
          type: string
          enum:
          - buyer
          - seller
    PairingsResponse:
      type: object
      properties:
        role:
          type: string
          enum:
          - buyer
          - seller
        buyer_id:
          type: integer
        seller_id:
          type: integer
        buyer_name:
          type: string
        seller_name:
          type: string
        pairings:
          type: array
          items:
            $ref: '#/components/schemas/Pairing'
        count:
          type: integer
    SearchSeller:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        sector:
          type: string
        revenue:
          type: number
        ebitda:
          type: number
        product:
          type: string
        contact_name:
          type: string
        contact_email:
          type: string
        paired:
          type: boolean
          description: Pairing already exists relative to this requesting session
    SearchBuyer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        sector:
          type: string
        ticket_min:
          type: number
        ticket_max:
          type: number
        contact:
          type: string
        contact_email:
          type: string
        paired:
          type: boolean
    SearchResponse:
      type: object
      properties:
        sellers:
          type: array
          items:
            $ref: '#/components/schemas/SearchSeller'
        buyers:
          type: array
          items:
            $ref: '#/components/schemas/SearchBuyer'
        total:
          type: integer
        query:
          type: string
    ActivityEvent:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        detail:
          type: string
        time:
          type: string
    TodoItem:
      type: object
      properties:
        type:
          type: string
          description: 'One of: nda, profile, matches, interest'
        action:
          type: string
          description: 'Surface/behaviour: nda (sign modal), settings, pipeline, ack (mark this signal reviewed), ack_all (mark every pending signal reviewed)'
        label:
          type: string
        detail:
          type: string
        priority:
          type: integer
        event:
          type: string
          description: 'For type=interest: the interaction event behind the item (pairing_created, phase_advanced, pairing_abandoned, pairing_closed, or rollup).'
        event_ids:
          type: array
          items:
            type: integer
          description: 'For type=interest: the interaction-ledger event ids to send to POST /api/interest-signals/{session_id}/ack. Empty for the ack_all rollup.'
    InterestSignalsResponse:
      type: object
      description: Inbound interest signals from counterparties about the session's own entity. Counts only; no counterparty identities.
      properties:
        context:
          type: string
          enum:
          - seller
          - buyer
        entity_id:
          type: integer
        entity_name:
          type: string
        searches:
          type: object
          properties:
            total:
              type: integer
              description: Counterparty searches whose results surfaced this entity (self-searches excluded).
            counterparties:
              type: integer
              description: Distinct counterparty sessions behind those searches.
            recent:
              type: array
              items:
                type: object
                properties:
                  query:
                    type: string
                  at:
                    type: string
        suggestions:
          type: object
          properties:
            total:
              type: integer
              description: Suggestion (matched) events referencing this entity.
            counterparties:
              type: integer
            parked:
              type: integer
              description: Pairings holding this entity at phase 0_prospecting, i.e. suggestions nobody has actioned.
            parked_counterparties:
              type: integer
            reach:
              type: integer
              description: Distinct counterparties that received this entity as a suggested match.
        pairings:
          type: object
          description: 'Interaction history: what counterparties have DONE with this profile — pairings created, every phase transition, drops and closes. Positive and negative alike. The live suggestion counts cannot carry this (a pairing leaves phase 0_prospecting as soon as it is actioned or dropped). `unnotified` is the hook a notifier consumes before marking events delivered.'
          properties:
            total:
              type: integer
              description: Ledger events recorded for this entity.
            counterparties:
              type: integer
              description: Distinct counterparties that ever paired this entity.
            created:
              type: integer
              description: Pairings created on this entity.
            advanced:
              type: integer
              description: Phase transitions that are progress.
            abandoned:
              type: integer
              description: Pairings a counterparty dropped.
            dropped:
              type: integer
              description: Alias of abandoned.
            closed:
              type: integer
              description: Pairings that reached a close.
            last_at:
              type:
              - string
              - 'null'
              description: Timestamp of the most recent interaction event.
            unnotified:
              type: integer
              description: Events not yet delivered to the workspace user.
            pending_review:
              type: integer
              description: Notifiable events (new pairing / phase change / drop / close) not yet reviewed. This is exactly what the Activity To Do block reports, so the card and the To Do list always agree.
            timeline:
              type: array
              description: The 10 most recent interaction events, oldest first.
              items:
                type: object
                properties:
                  id:
                    type: integer
                  event:
                    type: string
                  label:
                    type: string
                  cp_type:
                    type:
                    - string
                    - 'null'
                  cp_id:
                    type:
                    - integer
                    - 'null'
                  phase_from:
                    type:
                    - string
                    - 'null'
                  phase_to:
                    type:
                    - string
                    - 'null'
                  at:
                    type:
                    - string
                    - 'null'
                  source:
                    type:
                    - string
                    - 'null'
                  notified:
                    type: boolean
        universe:
          type: object
          properties:
            appearances:
              type:
              - integer
              - 'null'
              description: Counterparties whose scored universe contains this entity.
            universe_size:
              type:
              - integer
              - 'null'
              description: Counterparties swept (the denominator).
            best_score:
              type:
              - number
              - 'null'
            threshold:
              type: number
              description: Universe floor (50), the same cut the suggested-match reveal uses.
            scored:
              type: integer
              description: Counterparties that returned a usable score.
            unscored:
              type: integer
              description: Counterparties that returned no score (semantic step unavailable).
            no_embedding:
              type: integer
              description: Counterparties missing the embedding the semantic step needs. Reported, never auto-generated.
            entity_embedded:
              type: boolean
              description: Whether this entity itself carries the embedding the semantic step needs.
            cached:
              type: boolean
            computed_at:
              type: number
    ActivityResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/ActivityEvent'
        todo:
          type: array
          items:
            $ref: '#/components/schemas/TodoItem'
          description: 'Pending required actions for this session: agreement review if unsigned, profile completion, parked suggestions awaiting action, and unreviewed counterparty interaction signals (a pairing created on this profile, or a phase change on it). Each item carries {type, action, label, detail, priority}. Items of type=''interest'' are cleared by POST /api/interest-signals/{session_id}/ack; the others clear when the underlying condition is resolved. Array empty when nothing is pending.'
        nda_signed:
          type: boolean
          description: True when a server-side NDA signature exist for this session.
    ProductAnalysis:
      type: object
      properties:
        pairing_id:
          type: string
        website_url:
          type: string
        product_summary:
          type: string
        tech_stack:
          type: string
        quality_score:
          type: number
        buyer_fit_notes:
          type: string
        consolidation_potential:
          type: string
        last_analyzed_at:
          type: string
        buyer_solution_scope_1:
          type: string
        buyer_solution_scope_2:
          type: string
        buyer_solution_scope_3:
          type: string
        tech_stack_flags:
          type: string
        fit_score:
          type: number
        data_quality_flags:
          type: string
    NdaSignRequest:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        signer_name:
          type: string
        signerName:
          type: string
        company:
          type: string
        signedAt:
          type: string
        signed_at:
          type: string
      required:
      - session_id
      - signer_name
    NdaSignResponse:
      type: object
      properties:
        ok:
          type: boolean
        session_id:
          type: string
        nda_signed:
          type: boolean
    InterestAckRequest:
      type: object
      description: Acknowledge interaction signals. Send either event_ids (from the To Do item) or all=true. Events are scoped to the entity that session owns; only its own signals can be acknowledged.
      properties:
        event_ids:
          type: array
          items:
            type: integer
        all:
          type: boolean
          default: false
    InterestAckResponse:
      type: object
      properties:
        marked:
          type: integer
          description: Signals that moved to reviewed.
        pending:
          type: integer
          description: Signals still pending review for this entity after the call.
        entity_type:
          type: string
        entity_id:
          type: integer
    DealFlowResponse:
      type: object
      description: 'The supply-side counterpart of the Interest Signals card: the counterparty universe that matches the session''s OWN mandate, ranked, with what is new and the session''s watchlist. Names are masked ("Company A") until the session''s agreement is confirmed — the same reveal rule as /api/matches — so the payload is safe to render pre-reveal. Shares ONE memoised universe sweep with GET /api/interest-signals (24h TTL per entity).'
      properties:
        context:
          type: string
          enum:
          - seller
          - buyer
          description: Which side this session owns.
        counterparty_type:
          type: string
          enum:
          - seller
          - buyer
          description: The side being described (the opposite of context).
        entity_id:
          type: integer
        entity_name:
          type: string
        names_revealed:
          type: boolean
          description: True only when the session's ToS/NDA signature is confirmed. When false every name is "Company <letter>".
        mandate:
          type: object
          description: 'The session''s own criteria, echoed back (buyers: ticket range, geography, growth/EBITDA targets, sector; sellers: revenue, growth, valuation, sector).'
        universe:
          type: object
          properties:
            matched:
              type: integer
              description: Counterparties at or above the fit threshold (50).
            size:
              type:
              - integer
              - 'null'
              description: Counterparties swept (denominator).
            threshold:
              type:
              - number
              - 'null'
            best_score:
              type:
              - number
              - 'null'
            median_score:
              type:
              - number
              - 'null'
            bands:
              type: object
              description: Score-band distribution of the matched set (50-55 / 55-60 / 60-65 / 65+).
              additionalProperties:
                type: integer
            sectors:
              type: array
              items:
                type: object
                properties:
                  sector:
                    type: string
                  count:
                    type: integer
            avg_data_quality:
              type:
              - number
              - 'null'
            scored:
              type:
              - integer
              - 'null'
            unscored:
              type:
              - integer
              - 'null'
            computed_at:
              type:
              - number
              - 'null'
            cached:
              type: boolean
            truncated:
              type: boolean
              description: True when the ranked list was capped.
        fresh:
          type: object
          description: Freshness over the matched set. A counterparty's "last touch" is the later of its own record timestamp and its newest enrichment/update event; most sellers have no created_at, so the event is the signal.
          properties:
            window_days:
              type: integer
            counts:
              type: object
              description: Matched counterparties touched within 7 / 30 / 90 days.
              additionalProperties:
                type: integer
            count:
              type: integer
            items:
              type: array
              description: Newest touches first (capped at 12).
              items:
                $ref: '#/components/schemas/DealFlowCounterparty'
        top:
          type: array
          description: The ranked fits (capped at 25).
          items:
            $ref: '#/components/schemas/DealFlowCounterparty'
        watchlist:
          type: array
          description: Counterparties this session pinned, with their current fit, data quality and pairing phase.
          items:
            type: object
            properties:
              entity_type:
                type: string
                enum:
                - seller
                - buyer
              entity_id:
                type: integer
              note:
                type: string
              watched_at:
                type: string
              name:
                type:
                - string
                - 'null'
                description: Null until the agreement is confirmed.
              score:
                type:
                - number
                - 'null'
              data_quality:
                type:
                - integer
                - 'null'
              phase:
                type:
                - string
                - 'null'
    DealFlowCounterparty:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum:
          - seller
          - buyer
        name:
          type: string
          description: Real name when names_revealed, else "Company <letter>".
        revealed:
          type: boolean
        score:
          type: number
          description: Canonical fit score (deterministic x semantic).
        sector:
          type: string
        data_quality:
          type: number
        created_at:
          type:
          - string
          - 'null'
        last_touch:
          type:
          - string
          - 'null'
          description: Null when the counterparty has neither a record timestamp nor any logged event — reported as unknown, never invented.
        touch_kind:
          type: string
          enum:
          - sourced
          - enriched
        paired_phase:
          type:
          - string
          - 'null'
          description: Phase of this pairing for the session, when one exists.
        watched:
          type: boolean
        has_session:
          type: boolean
        revenue:
          type:
          - number
          - 'null'
          description: Seller counterparties only.
        growth:
          type:
          - number
          - 'null'
          description: Seller counterparties only (fraction).
        ebitda_margin:
          type:
          - number
          - 'null'
        valuation:
          type:
          - number
          - 'null'
        geography:
          type: string
        ticket_min:
          type:
          - number
          - 'null'
          description: Buyer counterparties only.
        ticket_max:
          type:
          - number
          - 'null'
        growth_target:
          type:
          - number
          - 'null'
        ebitda_target:
          type:
          - number
          - 'null'
    WatchlistRequest:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        entity_type:
          type: string
          enum:
          - seller
          - buyer
        entity_id:
          type: integer
        action:
          type: string
          enum:
          - add
          - remove
          default: add
        note:
          type: string
      required:
      - session_id
      - entity_type
      - entity_id
    WatchlistResponse:
      type: object
      properties:
        ok:
          type: boolean
        action:
          type: string
        entity_type:
          type: string
        watched:
          type: array
          items:
            type: integer
          description: The session's remaining watched ids of that entity_type.
    NdaTextResponse:
      type: object
      properties:
        name:
          type: string
        text:
          type: string
    PairingCreateRequest:
      type: object
      properties:
        buyer_id:
          type: integer
        seller_id:
          type: integer
        match_score:
          type: number
          default: 0
        phase:
          type: string
          default: 0_prospecting
      required:
      - buyer_id
      - seller_id
    PairingCreateResponse:
      type: object
      properties:
        pair_id:
          type: string
        buyer_id:
          type: integer
        seller_id:
          type: integer
        match_score:
          type: number
        phase:
          type: string
    PhaseUpdateResponse:
      type: object
      properties:
        updated:
          type: integer
        pair_ids:
          type: array
          items:
            type: string
        phase:
          type: string
        requested:
          type: array
          description: Changes raised for the counterparty to confirm instead of applied (mutual consent).
          items:
            type: object
            properties:
              request_id:
                type: integer
              pair_id:
                type: string
              from_phase:
                type: string
              to_phase:
                type: string
              requested_by:
                type: string
              counterparty_session:
                type: string
        blocked:
          type: array
          description: Pairings left untouched because a phase change is already awaiting a decision (the pairing is locked).
          items:
            type: object
            properties:
              pair_id:
                type: string
              reason:
                type: string
                enum:
                - awaiting_confirmation
                - no_counterparty
    PhaseRequestDecisionResponse:
      type: object
      properties:
        ok:
          type: boolean
        decision:
          type: string
          enum:
          - confirm
          - dismiss
          - cancel
        status:
          type: string
          enum:
          - confirmed
          - dismissed
          - cancelled
          - expired
        pair_id:
          type: string
        phase:
          type: string
          description: The pairing phase after the decision (unchanged for dismiss/cancel/expired).
        reason:
          type: string
          nullable: true
          enum:
          - expired
          - already_resolved
          - null
          description: '''expired'' when the request lapsed unanswered instead of being decided.'
    DqEnqueueRequest:
      type: object
      properties:
        entity_type:
          type: string
          enum:
          - seller
          - buyer
        entity_id:
          type: integer
        steps:
          type: array
          items:
            type: string
          description: 'Default seller steps: [siren, financials, president, advisor, contacts, product]; buyer: [discovery, profile]'
      required:
      - entity_type
      - entity_id
    DqEnqueueResponse:
      type: object
      properties:
        ok:
          type: boolean
        enqueued:
          type: integer
        steps:
          type: array
          items:
            type: string
        entity_type:
          type: string
        entity_id:
          type: integer
    SubmitRequest:
      type: object
      properties:
        session_id:
          type: string
        user_type:
          type: string
          enum:
          - investor
          - opportunity
          - seller
        identity:
          $ref: '#/components/schemas/Identity'
        buyer:
          $ref: '#/components/schemas/BuyerProfile'
        seller:
          $ref: '#/components/schemas/SellerProfile'
        turnstileToken:
          type: string
          description: Cloudflare Turnstile verification token (required)
      required:
      - user_type
      - turnstileToken
    SubmitResponse:
      type: object
      properties:
        session_id:
          type: string
        matches:
          type: integer
        match_details:
          type: array
          items:
            $ref: '#/components/schemas/Match'
        summary:
          type: string
    WorkspaceJoinRequest:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        company:
          type: string
        exchange_key:
          type: string
          description: 'TIER-2 GATE. Required when an AGENT (no verified Turnstile token) is issued a NEW workspace UUID: the msgid from an ACCEPTED manifest, or its answer_key. The handshake precedes the UUID — without it the join is refused (403) and the agent keeps the tier-1 exchange inbox. A human-verified join and an existing workspace are exempt.'
        turnstileToken:
          type: string
          description: Optional Cloudflare Turnstile token from a human solving the widget on the Join form. If provided it must verify or the join is refused (403). An agent POSTing directly sends none and stays classified as an agent by the NDA email actor-gate.
      required:
      - uuid
      - name
      - email
      - company
    WorkspaceJoinResponse:
      type: object
      properties:
        session_id:
          type: string
        uuid:
          type: string
        name:
          type: string
        email:
          type: string
        company:
          type: string
    WorkspaceInfo:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        company:
          type: string
        user_type:
          type: string
        created_at:
          type: string
    MatchedNames:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
          description: Non-redacted counterparty names (NDA-gated)
    EntityName:
      type: object
      properties:
        name:
          type: string
    InfoMemo:
      type: object
      properties:
        markdown:
          type: string
    LightInfoMemo:
      type: string
      format: binary
      description: Pretty/light InfoMemo PDF (Content-Type application/pdf)
    A2APart:
      type: object
      description: One content part. `text` is read; a `data` part is serialised as JSON. File parts (url/raw) are ignored, never fetched.
      properties:
        text:
          type: string
        data: {}
        url:
          type: string
        raw:
          type: string
          contentEncoding: base64
        filename:
          type: string
        mediaType:
          type: string
    A2AMessage:
      type: object
      required:
      - role
      - parts
      properties:
        messageId:
          type: string
        role:
          type: string
          enum:
          - ROLE_USER
          - ROLE_AGENT
        parts:
          type: array
          items:
            $ref: '#/components/schemas/A2APart'
        contextId:
          type: string
        taskId:
          type: string
        metadata:
          type: object
          description: Optional data. `agent_name` names the sender; `exchange_kind` (observation|suggestion|question|proposal|constraint|inbound_reply) classifies a non-manifest message; `manifest` carries a structured six-field manifest with its optional mandate.
        extensions:
          type: array
          items:
            type: string
    A2ATaskStatus:
      type: object
      required:
      - state
      properties:
        state:
          type: string
          enum:
          - TASK_STATE_SUBMITTED
          - TASK_STATE_INPUT_REQUIRED
          - TASK_STATE_COMPLETED
        timestamp:
          type: string
        message:
          $ref: '#/components/schemas/A2AMessage'
    A2ATask:
      type: object
      required:
      - id
      - status
      description: 'One record we hold for you: your message, our replies, and the result as an artifact. Not a job we are executing on your behalf.'
      properties:
        id:
          type: string
          description: The msgid — your key back to this exchange.
        contextId:
          type: string
        status:
          $ref: '#/components/schemas/A2ATaskStatus'
        history:
          type: array
          items:
            $ref: '#/components/schemas/A2AMessage'
        artifacts:
          type: array
          items:
            type: object
            properties:
              artifactId:
                type: string
              name:
                type: string
              parts:
                type: array
                items:
                  $ref: '#/components/schemas/A2APart'
        metadata:
          type: object
    A2ASendMessageRequest:
      type: object
      required:
      - message
      properties:
        message:
          $ref: '#/components/schemas/A2AMessage'
        configuration:
          type: object
          description: A push-notification config here is refused with PushNotificationNotSupportedError (we never push).
        metadata:
          type: object
        tenant:
          type: string
    A2AJsonRpcRequest:
      type: object
      required:
      - jsonrpc
      - method
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id: {}
        method:
          type: string
          enum:
          - SendMessage
          - SendStreamingMessage
          - GetTask
          - ListTasks
          - CancelTask
          - SubscribeToTask
          - CreateTaskPushNotificationConfig
          - GetTaskPushNotificationConfig
          - ListTaskPushNotificationConfigs
          - DeleteTaskPushNotificationConfig
          - GetExtendedAgentCard
          description: v1.0 operation names. Only SendMessage, GetTask and ListTasks are served; the rest answer with the protocol's own errors, as the Agent Card declares.
        params:
          type: object
