- name: Cape Partners Sniffer Agent API
  description: 'Machine-readable API backing the Cape Partners M&A deal-flow workspace — inbound submission, workspace session and profile management, ranked matching, valuation, pairings and mutual-consent phase changes, deal flow and interest signals, info memos, NDA/Terms signature, data-quality enqueue, and mandate proposals — as an OpenAPI 3.1 contract (47 paths, 48 operations) for autonomous agents. Session-scoped endpoints are keyed by a workspace UUID carried in the URL path; NDA-gated resources additionally require a recorded human signature.'
