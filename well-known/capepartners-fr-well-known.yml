  false_positive_note: 'The first probe of this run followed redirects and recorded 200 text/html for every apex path — the www HOMEPAGE, 39,963 bytes, every time. That is the SPA/catch-all false positive this recipe warns about, caught by comparing body sizes. The apex rows below record the raw 301 instead. On www and sniffer, unknown well-known paths answer a real 404 (a 330-byte text/html error page), so the 200s recorded there are real documents.'
