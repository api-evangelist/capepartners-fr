phases:
  note: 'Pairing phases named in the spec summary for POST /api/pairings/update_phase: 0_prospecting, 1_contact, 1_initial_contact, 2_… (the ToS list the pipeline as prospecting, contact, NDA, valuation, LOI, closing; llms-full.txt adds engagement, abandoned, closed). The full enum is not declared as a schema enum, so it is recorded as prose.'
  phase_request_status: [awaiting_confirmation, no_counterparty]
  phase_request_decision: [confirm, dismiss, cancel]
  phase_request_outcome: [confirmed, dismissed, cancelled, expired]
scoring:
  fit_score: deterministic(0-100) x semantic(0-1); deterministic = revenue_fit(30) + growth_fit(40) + ebitda_fit(30); threshold 50
  fit_bands: [strong, moderate, weak, poor]  # pre-NDA on /api/matches
  exchange_fit_bands: [strong, moderate, weak, thin, unproven]  # mandate disclosure; "a band is evidence, so it is never invented"
