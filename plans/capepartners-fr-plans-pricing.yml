model: No published plans or API pricing. Platform access (registration, workspace, matching, valuation, exchange, A2A) carries no listed price; Cape Partners earns an advisory fee only under a written Mandate agreed OFF-PLATFORM.
note: 'The Terms of Service are explicit that no price is set or disclosed by the platform: the "Platform Fee / Success Fee" is "agreed exclusively between the parties in the applicable off-platform Mandate. No Platform mechanism or these Terms set or disclose this fee; it is a matter of private negotiation" (Section 1), and "No fee is due until a Transaction actually closes" (Section 3.4). The API exposes a mandate PREVIEW (GET /api/mandate/{session_id} and /preview with live retainer / fee_pct parameters, and POST /api/mandate/request records a proposal with retainer and fee_pct) but the values are per-deal proposals, not a published tariff, and the spec states "the mandate executes OFF-PLATFORM — viewing or completing this text forms no mandate". The only fixed number in the Terms is a Liquidated Damages amount of two per cent (2%) of Enterprise Value for breach of the anti-circumvention covenant — a penalty, which the Terms say "is NOT, and does not constitute or imply, any success fee, finder''s fee, or advisory fee". Recorded here so it is not mistaken for pricing.'
